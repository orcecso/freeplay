[package]
name = "freeplay-app"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Tauri v2 desktop frontend for FreePlay."

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
trainer-core = { path = "../../crates/trainer-core" }
trainer-schema = { path = "../../crates/trainer-schema" }
trainer-repo = { path = "../../crates/trainer-repo" }
