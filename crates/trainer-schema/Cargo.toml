[package]
name = "trainer-schema"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Declarative JSON trainer schema, Cheat Engine .CT XML importer/exporter, and runtime session bridge."

[dependencies]
trainer-core = { path = "../trainer-core" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
quick-xml = "0.42"
thiserror = "2"
iced-x86 = { version = "1.21", features = ["code_asm"] }
