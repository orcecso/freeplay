[package]
name = "trainer-repo"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Tachiyomi-style community repository catalog, fetcher, SHA-256 verifier, and local trainer store."

[dependencies]
trainer-schema = { path = "../trainer-schema" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
sha2 = "0.10"
ureq = { version = "2", default-features = false, features = ["tls"] }
